[workspace]
members = ["crates/cim-core", "crates/cim-imageio", "crates/cim-cli", "crates/cim-bench", "crates/cim-lab"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yurii-Tor/Cimilarity"

[workspace.dependencies]
cim-core = { path = "crates/cim-core" }
cim-imageio = { path = "crates/cim-imageio" }
cim-lab = { path = "crates/cim-lab" }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
flate2 = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
