[workspace]
members = ["crates/brp-core", "crates/brp-imageio", "crates/brp-cli", "crates/brp-bench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yurii-tor/compresser"

[workspace.dependencies]
brp-core = { path = "crates/brp-core" }
brp-imageio = { path = "crates/brp-imageio" }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
